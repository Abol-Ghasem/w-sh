[general]
; Global shortcut. Modifiers: CTRL ALT SHIFT WIN. Key: A-Z, 0-9, F1-F24,
; SPACE, ENTER, TAB, ESC.
hotkey=CTRL+ALT+SPACE

; Speech engine: auto | server | local | command
;   auto    = server when api_key is set, then command, then local (Windows SAPI)
;   server  = any OpenAI compatible /audio/transcriptions endpoint (works for Persian)
;   local   = offline Windows Speech Recognition (English and a few other languages)
;   command = run an external program (e.g. whisper.cpp) on the recorded wav file
engine=auto

; Language hint for the server engine (fa, en, de, ...). Empty = auto detect.
language=

; Paste the result into the window that was focused before the bar appeared.
auto_paste=1

; 1 = paste immediately when transcription finishes, 0 = wait for Enter.
auto_accept=0

; Finish automatically when the speaker stops talking.
stop_on_silence=1
silence_ms=1200
max_record_ms=120000

[server]
base_url=https://api.openai.com/v1
api_key=
model=whisper-1
; Optional vocabulary / spelling hint sent to the server.
prompt=

[command]
; %wav% is replaced with the recorded file. Stdout is used as the text.
; Example (whisper.cpp):
;   line=C:\tools\whisper\whisper-cli.exe -m C:\tools\whisper\ggml-small.bin -l fa -nt -f "%wav%"
line=
